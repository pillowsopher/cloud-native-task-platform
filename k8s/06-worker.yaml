apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: uptime-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: ecr-registry-credentials
      containers:
        - name: worker
          image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/uptime-monitor-worker:latest
          imagePullPolicy: Always
          command:
            [
              "celery",
              "-A",
              "src.celery_app",
              "worker",
              "--loglevel=info",
              "--concurrency=4",
            ]
          envFrom:
            - secretRef:
                name: uptime-monitor-secrets
            - configMapRef:
                name: uptime-monitor-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 300Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  namespace: uptime-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beat
  template:
    metadata:
      labels:
        app: beat
    spec:
      imagePullSecrets:
        - name: ecr-registry-credentials
      containers:
        - name: beat
          image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/uptime-monitor-worker:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "src.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: uptime-monitor-secrets
            - configMapRef:
                name: uptime-monitor-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
