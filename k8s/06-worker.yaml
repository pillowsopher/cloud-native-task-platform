apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: uptime-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: uptime-monitor-worker:latest
          imagePullPolicy: IfNotPresent
          command:
            ["celery", "-A", "src.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: uptime-monitor-secrets
            - configMapRef:
                name: uptime-monitor-config
