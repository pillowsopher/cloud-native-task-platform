apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: task-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Replaced by CI with the ECR image tag at deploy time.
          image: <ECR_REPO_URL>/task-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: task-config
            - secretRef:
                name: task-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: task-platform
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 3000
